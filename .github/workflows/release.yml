name: Release

# A release happens when dev is merged into main. The version comes from
# src/Clamshield/Clamshield.csproj. If a tag for that version already exists, nothing is released.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Clamshield/Clamshield.csproj | head -n1)
          if [ -z "$VERSION" ]; then echo "No <Version> found in the csproj" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists, so there is nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test before releasing
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y clamav
      - run: dotnet test --configuration Release

  build:
    name: Build ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Clamshield/Clamshield.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$VERSION -p:DebugType=None -p:DebugSymbols=false --output publish

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/package.sh "${{ matrix.rid }}" "$VERSION" publish dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE, README.md -Destination publish
          Compress-Archive -Path "publish\*" -DestinationPath "dist\Clamshield-$env:VERSION-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: clamshield-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: clamshield-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Release notes
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          if [ ! -s notes.md ]; then echo "Release $VERSION" > notes.md; fi
          cat >> notes.md <<'NOTES'

          ## Install

          Download the file for your system, then follow [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md).
          The builds are not code-signed, so Windows and macOS will warn you the first time. The install guide explains why and what to do.
          Check your download against `SHA256SUMS.txt`.
          NOTES

      - name: Create release
        run: >
          gh release create "$TAG" dist/*
          --target "$GITHUB_SHA"
          --title "Clamshield $VERSION"
          --notes-file notes.md
