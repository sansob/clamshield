name: Feature request
description: Suggest something Clamshield could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation or problem first, before the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought about
  - type: checkboxes
    id: help
    attributes:
      label: Can you help
      options:
        - label: I would like to work on this myself
